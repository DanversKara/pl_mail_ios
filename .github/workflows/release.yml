name: Release

# Every push to main builds the app into an unsigned .ipa and publishes it as a
# GitHub Release, so https://github.com/DanversKara/pl_mail_ios/releases/latest
# always has the newest build (the BearerMail docs link there).
#
# Unsigned on purpose: there is no Apple developer account behind this
# repository. SideStore or AltStore sign the .ipa on the phone with the
# person's own (free) Apple ID — see docs/INSTALL-ON-DEVICE.md for building it
# in Xcode instead.
#
# The release also carries BearerMail-iOS.ipa under that fixed name, so
# releases/latest/download/BearerMail-iOS.ipa always gets the newest.
on:
    push:
        branches: [main]
        paths-ignore:
            - "**/*.md"
            - "docs/**"
    # A pull request builds and tests the same way but publishes nothing, so a
    # change is known to compile before it can reach main.
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: ios-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
    cancel-in-progress: false

jobs:
    ipa:
        runs-on: macos-26
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - name: Pick Xcode 26
              run: |
                  x="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
                  sudo xcode-select -s "$x"
                  xcodebuild -version

            # 0.1.<run number>: one version per build, always rising.
            - name: Version
              id: version
              run: |
                  base="$(sed -n 's/^MARKETING_VERSION = \([0-9]*\.[0-9]*\).*/\1/p' App/Config/Shared.xcconfig)"
                  echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

            - name: Build an unsigned archive
              run: |
                  set -o pipefail
                  xcodebuild archive \
                      -project plMail.xcodeproj -scheme plMail -configuration Release \
                      -destination 'generic/platform=iOS' \
                      -archivePath "$RUNNER_TEMP/plMail.xcarchive" \
                      MARKETING_VERSION="${{ steps.version.outputs.version }}" \
                      CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
                      CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
                      2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|\*\* ARCHIVE" || true
                  test -d "$RUNNER_TEMP/plMail.xcarchive/Products/Applications"

            - name: Package tests
              if: github.event_name == 'pull_request'
              working-directory: Packages/PLMail
              run: |
                  set -o pipefail
                  swift test 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "error:|✘|failed|passed after|Executed" || true
                  ! grep -qE "error:|✘ Test .* failed|with [1-9][0-9]* failures?" "$RUNNER_TEMP/test.log"

            - name: Errors, as annotations
              if: failure()
              run: cat "$RUNNER_TEMP"/*.log | grep -E "error:|✘" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done

            - name: Package the .ipa
              run: |
                  v="${{ steps.version.outputs.version }}"
                  mkdir -p "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/out"
                  cp -R "$RUNNER_TEMP/plMail.xcarchive/Products/Applications/"*.app "$RUNNER_TEMP/ipa/Payload/"
                  (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/out/BearerMail-iOS-$v.ipa" Payload)
                  cp "$RUNNER_TEMP/out/BearerMail-iOS-$v.ipa" "$RUNNER_TEMP/out/BearerMail-iOS.ipa"
                  ls -l "$RUNNER_TEMP/out"

            - name: Publish the GitHub Release
              if: github.event_name != 'pull_request'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.version.outputs.version }}
                  name: BearerMail for iOS ${{ steps.version.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  make_latest: true
                  generate_release_notes: true
                  files: ${{ runner.temp }}/out/*.ipa
                  body: |
                      Unsigned build. Install with [SideStore](https://sidestore.io) or [AltStore](https://altstore.io) using your own Apple ID — step by step on https://docs.bearermail.com/ios.html.
